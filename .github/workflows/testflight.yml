name: GazeRadar TestFlight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gazeradar-testflight
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      APPLE_TEAM_ID: VDJPBJ666U
      APPLE_APP_ID: '6827947653'
      APPLE_BUNDLE_ID: com.wiantribe.gazeradar
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate signing configuration
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync ios
      - name: Sign, archive, and upload to Apple
        run: bash mobile/scripts/upload-testflight.sh
      - name: Remove signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/gazeradar-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gazeradar-signing"
