name: GazeRadar mobile builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'capacitor.config.json', '.github/workflows/mobile-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Configure Firebase when available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
          fi
      - run: pnpm exec cap sync android
      - name: Build installable debug APK
        working-directory: mobile/android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GazeRadar-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  iphone:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec cap sync ios
      - name: Compile unsigned iPhone app
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/package/Payload/
          cd build/package
          zip -qr ../GazeRadar-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GazeRadar-iPhone-unsigned
          path: build/GazeRadar-unsigned.ipa
          retention-days: 7
